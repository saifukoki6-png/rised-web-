<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Card Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root { --bg:#f1ebdf; --ink:#0b1220; --blue:#5b9bd5; --brand:#1b5fb4; --panel:#ffffff; --line:#d9d2c3; --page:#e7e2d8; }
  @media (prefers-color-scheme: dark) {
    :root { --panel:#1c2230; --line:#343c50; --page:#10141d; --ctl:#e8ecf4; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Montserrat, system-ui, sans-serif; background:var(--page); color:var(--ctl, #14181f); }
  .app { max-width: 1100px; margin: 0 auto; padding: 16px; display:grid; gap:16px; }
  @media (min-width: 900px) { .app { grid-template-columns: 340px 1fr; align-items:start; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; display:grid; gap:12px; }
  label { font-size:13px; font-weight:600; display:grid; gap:6px; }
  textarea, input { font:inherit; font-size:15px; padding:10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; width:100%; }
  textarea { min-height:150px; resize:vertical; line-height:1.4; }
  .hint { font-size:12px; opacity:.75; margin:0; line-height:1.4; }
  button { font:inherit; font-weight:600; font-size:15px; padding:12px 16px; border:0; border-radius:8px; background:#1b5fb4; color:#fff; cursor:pointer; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline:3px solid #f0a500; outline-offset:2px; }

  .stage { width:100%; aspect-ratio:1/1; overflow:hidden; border-radius:8px; }
  .scaler { width:1080px; height:1080px; transform-origin: top left; }

  /* ---- the card (1080 x 1080) ---- */
  #card { position:relative; width:1080px; height:1080px; overflow:hidden; background: var(--bg); color:#0b1220; font-family: Montserrat, sans-serif; }
  #card .sky { position:absolute; inset:0; background:
      radial-gradient(ellipse at 55% 80%, rgba(255,196,120,.55), transparent 55%),
      linear-gradient(#f3ecdf 0%, #f1e6d3 60%, #f0d9b8 100%); }
  #card .grain { position:absolute; inset:0; opacity:.35; mix-blend-mode:multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .35  0 0 0 .25 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>"); }
  #card svg.scene { position:absolute; left:0; bottom:0; width:100%; height:430px; }

  #card .photo, #card .wash { position:absolute; inset:0; display:none; }
  #card .photo { background-size:cover; background-position:center bottom; }
  #card .wash { background: linear-gradient(to bottom, rgba(244,238,226,var(--wash,.85)) 0%, rgba(244,238,226,calc(var(--wash,.85)*.9)) 60%, rgba(244,238,226,0) 74%, rgba(7,13,24,.55) 82%, rgba(7,13,24,.92) 100%); }
  #card.has-photo .photo, #card.has-photo .wash { display:block; }
  #card.has-photo .sky, #card.has-photo svg.scene { display:none; }
  #card.builtin .wash { display:none; }
  .file { font-weight:600; }
  .row { display:flex; gap:8px; }
  .row button { flex:1; }
  button.alt { background:transparent; color:inherit; border:1px solid var(--line); }
  .logo { position:absolute; top:34px; left:0; right:0; text-align:center; }
  .logo svg { width:136px; height:auto; }
  .brand { position:absolute; top:160px; left:0; right:0; text-align:center; font-weight:600; font-size:41px; letter-spacing:.34em; padding-left:.34em; }
  .tag { position:absolute; top:212px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:16px; font-size:13.5px; letter-spacing:.28em; font-weight:500; }
  .tag::before, .tag::after { content:""; height:2px; width:62px; background:#0b1220; }

  .quote { position:absolute; top:268px; left:60px; right:60px; text-align:center; font-family:'Playfair Display', Georgia, serif; font-weight:800; font-size:68px; line-height:1.17; letter-spacing:-.01em; }
  .quote .ln { display:block; }
  .quote .hl { position:relative; display:inline-block; padding:0 26px; margin:2px 0; z-index:0; }
  .quote .hl::before { content:""; position:absolute; left:0; right:0; top:8%; bottom:4%; z-index:-1; background:var(--blue); opacity:.9;
      clip-path: polygon(1% 18%, 4% 4%, 12% 12%, 30% 2%, 55% 8%, 80% 0, 96% 10%, 99% 30%, 100% 52%, 97% 78%, 98% 94%, 80% 100%, 55% 94%, 30% 100%, 8% 92%, 3% 98%, 0 72%, 2% 46%); }

  .attr { position:absolute; top:760px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:14px; font-size:15.5px; letter-spacing:.3em; font-weight:500; }
  .attr::before, .attr::after { content:""; width:30px; height:2px; background:#0b1220; }

  .follow { position:absolute; left:0; right:0; bottom:176px; display:flex; align-items:center; justify-content:center; gap:22px; color:#f4efe6; font-size:16px; letter-spacing:.3em; font-weight:500; }
  .follow::before, .follow::after { content:""; height:1px; width:110px; background:rgba(244,239,230,.7); }
  .cats { position:absolute; left:60px; right:60px; bottom:56px; display:flex; justify-content:space-between; color:#f4efe6; }
  .cat { flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; font-size:12.5px; letter-spacing:.2em; font-weight:500; position:relative; }
  .cat + .cat::before { content:""; position:absolute; left:0; top:4px; height:44px; width:1px; background:rgba(244,239,230,.45); }
  .cat svg { width:34px; height:34px; stroke:#f4efe6; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .social { position:absolute; left:0; right:0; bottom:14px; display:flex; justify-content:center; align-items:center; gap:18px; color:#f4efe6; font-size:14.5px; letter-spacing:.28em; font-weight:500; }
  .social svg { width:22px; height:22px; fill:#f4efe6; }
  .social .bar { width:1px; height:26px; background:rgba(244,239,230,.5); }
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <label>Quote
      <textarea id="quote">Nobody is coming to save you. Build the discipline to become the person you have been waiting for.</textarea>
    </label>
    <p class="hint">Just paste your quote. Line breaks and blue highlights are added automatically.</p>
    <label>Brand name <input id="brand" value="RISE THEORY"></label>
    <label>Tagline <input id="tagline" value="CHANGE YOUR MIND. CHANGE YOUR LIFE."></label>
    <label>Attribution <input id="attr" value="RISE THEORY"></label>
    <label>Footer handle <input id="handle" value="RISE THEORY"></label>
    <button id="dl">Download PNG</button>
    <p class="hint">Edits update the card live. The download is 2160 × 2160.</p>
  </div>

  <div class="stage" id="stage">
    <div class="scaler" id="scaler">
      <div id="card" class="has-photo builtin">

<script>
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));


  // Auto layout: balanced line breaks + highlight the key lines.
  function layout(raw) {
    let text = raw.replace(/^[\s"\u201C\u201D]+|[\s"\u201C\u201D]+$/g, '');
    // manual override: lines wrapped in ==...==
    if (text.includes('==')) {
      return text.split('\n').filter(l => l.trim()).map(l => {
        const m = l.trim().match(/^==(.*)==$/);
        return { text: m ? m[1] : l.trim(), hl: !!m };
      });
    }
    text = text.replace(/\s+/g, ' ');
    if (!text) return [];
    const sentences = text.match(/[^.!?]+[.!?]*/g).map(x => x.trim()).filter(Boolean);
    const MAX = 26;
    const wrap = str => {
      const ws = str.split(' ');
      const n = Math.max(1, Math.ceil(str.length / MAX));
      const target = str.length / n;
      const res = []; let cur = '';
      ws.forEach(w => {
        if (cur && cur.length + 1 + w.length > target + 2 && res.length < n - 1) { res.push(cur); cur = w; }
        else cur = cur ? cur + ' ' + w : w;
      });
      if (cur) res.push(cur);
      return res;
    };
    let out = [];
    sentences.forEach((sen, si) => wrap(sen).forEach(t => out.push({ text: t, si, hl: false })));
    // single sentence: split it in half so there is something to highlight
    let keyIdx;
    if (sentences.length > 1) keyIdx = out.map((l, i) => l.si === sentences.length - 1 ? i : -1).filter(i => i >= 0);
    else keyIdx = out.map((l, i) => i).filter(i => i >= Math.floor(out.length / 2));
    if (keyIdx.length <= 2) keyIdx.forEach(i => out[i].hl = true);
    else keyIdx.forEach((i, k) => { out[i].hl = !(k === 1 && keyIdx.length === 3) && !(k % 2 === 1 && keyIdx.length > 3 && k !== keyIdx.length - 1); });
    return out;
  }

  function render() {
    $('o-brand').textContent = $('brand').value;
    $('o-tag').textContent = $('tagline').value;
    $('o-attr').textContent = $('attr').value;
    $('o-follow').textContent = $('handle').value;
    $('o-handle').textContent = $('handle').value;

    const lines = layout($('quote').value);
    const html = lines.map((l, i) => {
      let t = l.text;
      if (i === 0) t = '\u201C' + t;
      if (i === lines.length - 1) t = t + '\u201D';
      const inner = esc(t);
      return `<span class="ln">${l.hl ? `<span class="hl">${inner}</span>` : inner}</span>`;
    }).join('');
    $('o-quote').innerHTML = html;
    fit();
  }

  // shrink quote font if it would collide with the attribution line
  function fit() {
    const q = $('o-quote'); let size = 68; q.style.fontSize = size + 'px';
    while (q.offsetHeight > 480 && size > 30) { size -= 2; q.style.fontSize = size + 'px'; }
  }

  function scale() {
    const w = $('stage').clientWidth;
    $('scaler').style.transform = `scale(${w / 1080})`;
  }

  ['quote','brand','tagline','attr','handle'].forEach(id => $(id).addEventListener('input', render));
  window.addEventListener('resize', scale);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { render(); scale(); });
  render(); scale();


  $('dl').addEventListener('click', async () => {
    const btn = $('dl'); btn.textContent = 'Preparing…';
    const scaler = $('scaler'); const prev = scaler.style.transform; scaler.style.transform = 'none';
    try {
      const canvas = await html2canvas($('card'), { scale: 2, useCORS: true, backgroundColor: null });
      const a = document.createElement('a');
      a.download = 'quote-card.png'; a.href = canvas.toDataURL('image/png'); a.click();
    } catch (e) { alert('Download failed. Take a screenshot of the card instead.'); }
    scaler.style.transform = prev; btn.textContent = 'Download PNG';
  });
</script>
